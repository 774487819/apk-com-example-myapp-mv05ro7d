name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          set -e
          mkdir app_build && cd app_build
          w(){ mkdir -p "$(dirname "$1")"; base64 -d > "$1"; }
          echo cGx1Z2luTWFuYWdlbWVudCB7IHJlcG9zaXRvcmllcyB7IGdvb2dsZSgpOyBtYXZlbkNlbnRyYWwoKTsgZ3JhZGxlUGx1Z2luUG9ydGFsKCkgfSB9CmRlcGVuZGVuY3lSZXNvbHV0aW9uTWFuYWdlbWVudCB7IHJlcG9zaXRvcmllcyB7IGdvb2dsZSgpOyBtYXZlbkNlbnRyYWwoKSB9IH0Kcm9vdFByb2plY3QubmFtZSA9ICJBcHAiCmluY2x1ZGUgJzphcHAnCg== | w 'settings.gradle'
          echo cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC41LjInIGFwcGx5IGZhbHNlIH0K | w 'build.gradle'
          echo b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bQphbmRyb2lkLnVzZUFuZHJvaWRYPXRydWUK | w 'gradle.properties'
          echo  | w 'app/build.gradle'
          echo  | w 'app/src/main/AndroidManifest.xml'
          echo PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj7Yqti32KjZitmCPC9zdHJpbmc+PC9yZXNvdXJjZXM+Cg== | w 'app/src/main/res/values/strings.xml'
          echo  | w 'app/src/main/java/com/example/myapp/MainActivity.java'
          echo  | w 'app/src/main/assets/index.html'
      - name: Build
        working-directory: app_build
        run: gradle assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" app_build/app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY" --title "APK" --notes "ready"
